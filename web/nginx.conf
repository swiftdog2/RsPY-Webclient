server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: Do NOT set Cross-Origin-Embedder-Policy: require-corp here.
    # CheerpJ 3 does not require cross-origin isolation, and COEP breaks its
    # cross-origin filesystem iframe handshake (symptom: "No Listener:
    # tabs:outgoing.message.ready" during cheerpjFSInit / ipfCreateIFrame).

    # Serve the client jar with a sane type.
    types {
        text/html                             html;
        application/javascript                js;
        application/java-archive              jar;
        application/wasm                      wasm;
        application/octet-stream              sf2;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
